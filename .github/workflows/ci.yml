name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run the tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test
